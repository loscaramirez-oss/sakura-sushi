<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e8367c">
<title>Sakura Sushi · Panel de pedidos</title>
<link rel="icon" type="image/png" href="../logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="pin-screen" id="pinScreen">
  <div class="pin-card">
    <img src="../logo.png" alt="Sakura Sushi" class="pin-logo">
    <h1>Panel de pedidos</h1>
    <p>Sakura Sushi Paseos Mid</p>
    <input type="text" id="loginUser" placeholder="Usuario" autocomplete="off" autofocus>
    <input type="password" id="loginPass" placeholder="Contraseña">
    <button class="btn btn-primary" id="loginBtn">Entrar</button>
    <div class="pin-err hidden" id="loginErr">Usuario o contraseña incorrectos</div>
  </div>
</div>

<div class="app hidden" id="app">
  <header>
    <div class="hd-title">
      <img src="../logo.png" alt="Sakura Sushi" class="hd-logo">
      <div>
        <h1>Panel de pedidos</h1>
        <div class="hd-sub">Sakura Sushi Paseos Mid</div>
      </div>
      <div class="hd-user">
        <span id="hdUserName"></span>
        <span class="hd-rol" id="hdUserRol"></span>
      </div>
    </div>
    <div class="hd-actions">
      <button class="turno-badge" id="turnoBadge">🔴 Clic para abrir turno</button>
      <button class="btn btn-primary" id="usersBtn" style="display:none">👥 Usuarios</button>
      <button class="btn btn-primary" id="productsBtn" style="display:none">📦 Productos</button>
      <button class="btn btn-primary" id="newOrderBtn">➕ Nuevo pedido</button>
      <label class="switch" title="Sonido al llegar un pedido">
        <input type="checkbox" id="soundToggle" checked>
        <span>🔔</span>
      </label>
      <button class="btn ghost" id="csvBtn">⬇ CSV</button>
      <button class="btn ghost" id="logoutBtn">Salir</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><b id="stNuevos">0</b><span>nuevos</span></div>
    <div class="stat"><b id="stHoy">0</b><span>pedidos hoy</span></div>
    <div class="stat"><b id="stIngresos">$0</b><span>ingresos hoy</span></div>
  </div>

  <div class="filters">
    <label class="chk"><input type="checkbox" id="onlyNew"> Solo nuevos</label>
    <label class="chk"><input type="checkbox" id="showArch"> Ver archivados</label>
    <label class="chk" title="Imprimir ticket automáticamente al llegar un pedido"><input type="checkbox" id="autoPrintToggle" checked> 🖨 Auto</label>
    <span class="refresh-note" id="refreshNote"></span>
  </div>

  <div id="orders" class="orders"></div>
</div>

<div class="modal hidden" id="newOrderModal">
  <div class="modal-card">
    <div class="modal-head">
      <h2>➕ Nuevo pedido</h2>
      <button class="btn ghost" id="closeNewBtn">✕</button>
    </div>
    <div class="modal-body">

      <div class="seg" id="segType">
        <button class="seg-btn on" data-t="restaurante">🍽 Restaurante</button>
        <button class="seg-btn" data-t="llevar">🛍 Para llevar</button>
        <button class="seg-btn" data-t="domicilio">🛵 Domicilio</button>
      </div>

      <div class="frow" id="rowMesa">
        <label>Mesa</label>
        <input type="number" id="noMesa" value="1" min="1">
      </div>

      <div class="frow">
        <label>Nombre (opcional)</label>
        <input type="text" id="noName" placeholder="Nombre del cliente">
      </div>

      <div class="frow" id="rowPhone">
        <label>Teléfono</label>
        <input type="text" id="noPhone" placeholder="999 000 0000">
      </div>

      <div class="frow" id="rowAddr">
        <label>Dirección</label>
        <input type="text" id="noAddr" placeholder="Calle, número, colonia...">
      </div>

      <div class="frow">
        <label>Pago</label>
        <select id="noPay">
          <option>Efectivo</option>
          <option>Tarjeta</option>
          <option>Transferencia</option>
        </select>
      </div>

      <div class="picker">
        <input type="text" id="noSearch" placeholder="🔍 Buscar platillo...">
        <div class="tabs" id="noTabs"></div>
        <div class="p-grid" id="noGrid"></div>
        <div class="variant-overlay hidden" id="noVariant">
          <div class="variant-card" id="noVariantList"></div>
        </div>
      </div>

      <div class="frow">
        <label>Notas</label>
        <input type="text" id="noNotes" placeholder="Ej. sin cebolla">
      </div>

      <div class="no-cart">
        <div class="no-cart-head"><h3>Pedido</h3><button class="btn ghost" id="noClear">Vaciar</button></div>
        <div id="noItems"></div>
        <div class="no-total">Total: <b id="noTotal">$0</b></div>
      </div>

    </div>
    <div class="modal-foot">
      <button class="btn btn-primary" id="saveOrderBtn">📨 Guardar y enviar a cocina</button>
    </div>
  </div>
</div>

<div class="modal hidden" id="usersModal">
  <div class="modal-card">
    <div class="modal-head">
      <h2>👥 Gestión de usuarios</h2>
      <button class="btn ghost" id="closeUsersBtn">✕</button>
    </div>
    <div class="modal-body">
      <div class="frow">
        <label>Usuario</label>
        <input type="text" id="umUser" placeholder="Nombre de usuario">
      </div>
      <div class="frow">
        <label>Nombre completo</label>
        <input type="text" id="umName" placeholder="Ej. María López">
      </div>
      <div class="frow">
        <label>Contraseña</label>
        <input type="password" id="umPass" placeholder="Mínimo 4 caracteres">
      </div>
      <div class="frow">
        <label>Rol</label>
        <select id="umRol">
          <option value="cajero">Cajero</option>
          <option value="admin">Administrador</option>
          <option value="cocina">Cocina</option>
        </select>
      </div>
      <button class="btn btn-primary" id="addUserBtn" style="width:100%;margin-top:12px">➕ Agregar usuario</button>
      <div style="margin-top:16px">
        <h3>Usuarios</h3>
        <div id="usersList"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal hidden" id="productsModal">
  <div class="modal-card" style="max-width:600px">
    <div class="modal-head">
      <h2>📦 Gestión de productos</h2>
      <button class="btn ghost" id="closeProductsBtn">✕</button>
    </div>
    <div class="modal-body">
      <div class="frow"><label>Categoría</label><input type="text" id="pmCat" placeholder="Ej. Entradas"></div>
      <div class="frow"><label>Nombre</label><input type="text" id="pmName" placeholder="Nombre del platillo"></div>
      <div class="frow"><label>Precio</label><input type="number" id="pmPrice" placeholder="0" min="0"></div>
      <div class="frow"><label>Estación</label><input type="text" id="pmEstacion" placeholder="Ej. cocina, sushi, bebidas" list="pmEstList"><datalist id="pmEstList"></datalist></div>
      <div class="frow"><label>Descripción</label><input type="text" id="pmDesc" placeholder="Opcional"></div>
      <button class="btn btn-primary" id="addProductBtn" style="width:100%;margin-top:12px">➕ Agregar producto</button>
      <div style="margin-top:16px"><input type="text" id="pmSearch" placeholder="🔍 Buscar producto..." style="width:100%;padding:8px;border:1.5px solid var(--border);border-radius:10px"></div>
      <div id="productsList" style="margin-top:10px;max-height:400px;overflow-y:auto"></div>
    </div>
  </div>
</div>

<div class="modal hidden" id="turnoModal">
  <div class="modal-card" style="max-width:420px">
    <div class="modal-head">
      <h2 id="turnoTitle">🕐 Abrir turno</h2>
      <button class="btn ghost" id="closeTurnoBtn">✕</button>
    </div>
    <div class="modal-body" id="turnoBody"></div>
  </div>
</div>

<div class="modal hidden" id="cobroModal">
  <div class="modal-card" style="max-width:400px">
    <div class="modal-head">
      <h2>💵 Cobrar pedido</h2>
      <button class="btn ghost" id="closeCobroBtn">✕</button>
    </div>
    <div class="modal-body">
      <div id="cobroInfo" style="text-align:center;margin-bottom:16px"></div>
      <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:8px">MÉTODO DE PAGO</label>
      <div class="pay-methods" id="payMethods">
        <button class="pay-btn" data-m="efectivo">💵<span>Efectivo</span></button>
        <button class="pay-btn" data-m="tarjeta">💳<span>Tarjeta</span></button>
        <button class="pay-btn" data-m="transferencia">🏦<span>Transf.</span></button>
        <button class="pay-btn" data-m="didi">🛵<span>DIDI</span></button>
        <button class="pay-btn" data-m="uber">🚗<span>Uber</span></button>
        <button class="pay-btn" data-m="rappi">📦<span>Rappi</span></button>
      </div>
      <div id="cobroFields" style="margin-top:14px"></div>
      <button class="btn btn-green" id="confirmCobroBtn" style="width:100%;margin-top:14px;padding:13px;font-size:15px">💵 Confirmar cobro</button>
    </div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>
<div class="print-area" id="printArea"></div>

<script src="../js/config/brand-config.js"></script>
<script src="../js/data/menu-data.js"></script>
<script src="admin.js"></script>
</body>
</html>
