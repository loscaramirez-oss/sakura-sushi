<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e8367c">
<title>Sakura Sushi · Panel de pedidos</title>
<link rel="icon" type="image/png" href="../logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="pin-screen" id="pinScreen">
  <div class="pin-card">
    <img src="../logo.png" alt="Sakura Sushi" class="pin-logo">
    <h1>Panel de pedidos</h1>
    <p>Sakura Sushi Paseos Mid</p>
    <input type="password" id="pinInput" inputmode="numeric" maxlength="6" placeholder="PIN" autocomplete="off">
    <button class="btn btn-primary" id="pinBtn">Entrar</button>
    <div class="pin-err hidden" id="pinErr">PIN incorrecto</div>
  </div>
</div>

<div class="app hidden" id="app">
  <header>
    <div class="hd-title">
      <img src="../logo.png" alt="Sakura Sushi" class="hd-logo">
      <div>
        <h1>Panel de pedidos</h1>
        <div class="hd-sub">Sakura Sushi Paseos Mid</div>
      </div>
    </div>
    <div class="hd-actions">
      <button class="btn btn-primary" id="newOrderBtn">➕ Nuevo pedido</button>
      <label class="switch" title="Sonido al llegar un pedido">
        <input type="checkbox" id="soundToggle" checked>
        <span>🔔</span>
      </label>
      <button class="btn ghost" id="csvBtn">⬇ CSV</button>
      <button class="btn ghost" id="logoutBtn">Salir</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><b id="stNuevos">0</b><span>nuevos</span></div>
    <div class="stat"><b id="stHoy">0</b><span>pedidos hoy</span></div>
    <div class="stat"><b id="stIngresos">$0</b><span>ingresos hoy</span></div>
  </div>

  <div class="filters">
    <label class="chk"><input type="checkbox" id="onlyNew"> Solo nuevos</label>
    <label class="chk"><input type="checkbox" id="showArch"> Ver archivados</label>
    <label class="chk" title="Imprimir ticket automáticamente al llegar un pedido"><input type="checkbox" id="autoPrintToggle" checked> 🖨 Auto</label>
    <span class="refresh-note" id="refreshNote"></span>
  </div>

  <div id="orders" class="orders"></div>
</div>

<div class="modal hidden" id="newOrderModal">
  <div class="modal-card">
    <div class="modal-head">
      <h2>➕ Nuevo pedido</h2>
      <button class="btn ghost" id="closeNewBtn">✕</button>
    </div>
    <div class="modal-body">

      <div class="seg" id="segType">
        <button class="seg-btn on" data-t="restaurante">🍽 Restaurante</button>
        <button class="seg-btn" data-t="llevar">🛍 Para llevar</button>
        <button class="seg-btn" data-t="domicilio">🛵 Domicilio</button>
      </div>

      <div class="frow" id="rowMesa">
        <label>Mesa</label>
        <input type="number" id="noMesa" value="1" min="1">
      </div>

      <div class="frow">
        <label>Nombre (opcional)</label>
        <input type="text" id="noName" placeholder="Nombre del cliente">
      </div>

      <div class="frow" id="rowPhone">
        <label>Teléfono</label>
        <input type="text" id="noPhone" placeholder="999 000 0000">
      </div>

      <div class="frow" id="rowAddr">
        <label>Dirección</label>
        <input type="text" id="noAddr" placeholder="Calle, número, colonia...">
      </div>

      <div class="frow">
        <label>Pago</label>
        <select id="noPay">
          <option>Efectivo</option>
          <option>Tarjeta</option>
          <option>Transferencia</option>
        </select>
      </div>

      <div class="picker">
        <input type="text" id="noSearch" placeholder="🔍 Buscar platillo...">
        <div class="tabs" id="noTabs"></div>
        <div class="p-grid" id="noGrid"></div>
        <div class="variant-overlay hidden" id="noVariant">
          <div class="variant-card" id="noVariantList"></div>
        </div>
      </div>

      <div class="frow">
        <label>Notas</label>
        <input type="text" id="noNotes" placeholder="Ej. sin cebolla">
      </div>

      <div class="no-cart">
        <div class="no-cart-head"><h3>Pedido</h3><button class="btn ghost" id="noClear">Vaciar</button></div>
        <div id="noItems"></div>
        <div class="no-total">Total: <b id="noTotal">$0</b></div>
      </div>

    </div>
    <div class="modal-foot">
      <button class="btn btn-primary" id="saveOrderBtn">📨 Guardar y enviar a cocina</button>
    </div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>
<div class="print-area" id="printArea"></div>

<script src="../js/config/brand-config.js"></script>
<script src="../js/data/menu-data.js"></script>
<script src="admin.js"></script>
</body>
</html>
